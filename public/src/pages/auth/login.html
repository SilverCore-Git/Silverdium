            .custom-checkbox {

            .custom-checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 18px;
            gap: 10px;
            }

            .custom-checkbox-label::before {
            content: "";
            width: 20px;
            height: 20px;
            border-radius: 6px;
            border: 2px solid #4CAF50;
            display: inline-block;
            position: relative;
            transition: all 0.3s ease-in-out;
            background: #fff;
            }

            .custom-checkbox-label:hover::before {
            border-color: #45a049;
            }

            .custom-checkbox:checked + .custom-checkbox-label::before {
            background-color: #4CAF50;
            border-color: #4CAF50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.6);
            }

            .custom-checkbox:checked + .custom-checkbox-label::before {
            content: "✔";
            font-size: 12px;
            color: white;
            text-align: center;
            line-height: 20px;
            font-weight: bold;
            }
